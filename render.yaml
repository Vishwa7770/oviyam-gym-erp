services:
  - type: web
    name: oviyam-gym-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: oviyam-gym-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: oviyam-gym-db
    plan: free
